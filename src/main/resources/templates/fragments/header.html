<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="header" class="topbar">
    <div class="brand">
        <a th:href="@{/}">UTEShop</a>
    </div>

    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a th:href="@{/products}" sec:authorize="isAuthenticated()">Sản phẩm</a>
        <a th:href="@{/users}" sec:authorize="hasRole('ADMIN')">Quản lý Người dùng</a>

        <div th:if="${#authorization.expression('isAuthenticated()')}" class="account">
            <!-- Avatar -->
            <img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}"
                 alt="Avatar" width="40" height="40" style="border-radius:50%; object-fit:cover;" class="avatar-img">

            <!-- Full Name -->
            <span th:text="${#authentication.principal.fullName}">Nguyễn Văn A</span>

            <!-- Username -->
            <span th:text="'(' + ${#authentication.principal.username} + ')'">(nguyenvana)</span>

            <!-- Email -->
            <span th:text="${#authentication.principal.email}">email@gmail.com</span>

            <!-- Role -->
            <span class="badge badge-admin" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:text="${#authentication.principal.role}">ROLE_ADMIN</span>
            <span class="badge badge-user" th:unless="${#authorization.expression('hasRole(''ADMIN'')')}" th:text="${#authentication.principal.role}">ROLE_USER</span>

            <!-- Logout Form -->
            <form th:action="@{/logout}" method="post" style="display:inline; margin-left: 10px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="link-button" type="submit">Đăng xuất</button>
            </form>
        </div>

        <div th:unless="${#authorization.expression('isAuthenticated()')}" class="account">
            <a th:href="@{/login}" class="btn primary small">Đăng nhập</a>
            <a th:href="@{/register}" class="btn secondary small">Đăng ký</a>
        </div>
    </nav>
</header>

</body>
</html>
