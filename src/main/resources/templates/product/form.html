<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${productDTO.id != null} ? 'Sửa Product - Vũ Nam Sang 24133048' : 'Thêm Product - Vũ Nam Sang 24133048'">Tạo/Sửa Product</title>
</head>
<body>

<main layout:fragment="content">
    <div class="page-title">
        <h1 th:text="${productDTO.id != null} ? 'Sửa Product' : 'Thêm Product'">Product</h1>
        <a th:href="@{/products}" class="btn secondary">Quay lại danh sách</a>
    </div>

    <div class="panel narrow">
        <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="${productDTO.id != null} ? @{/products/edit/{id}(id=${productDTO.id})} : @{/products/create}"
              th:object="${productDTO}" method="post" enctype="multipart/form-data" class="form-grid">

            <input type="hidden" th:field="*{id}">

            <label for="name">Tên sản phẩm</label>
            <div>
                <input id="name" type="text" th:field="*{name}" required placeholder="Tên sản phẩm">
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <label for="description">Mô tả</label>
            <div>
                <textarea id="description" th:field="*{description}" rows="5" placeholder="Mô tả sản phẩm..."></textarea>
            </div>

            <label for="price">Giá</label>
            <div>
                <input id="price" type="number" step="0.01" th:field="*{price}" required placeholder="0.00">
                <div class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>

            <label for="image">Ảnh</label>
            <div>
                <input id="image" type="file" name="imageFile" accept="image/*">
                <div th:if="${productDTO.imageUrl != null}" style="margin-top: 10px;">
                    <img th:src="${productDTO.imageUrl.contains('|') ? #strings.substringBefore(productDTO.imageUrl, '|') : productDTO.imageUrl}"
                         alt="Preview" class="thumb">
                </div>
            </div>

            <div class="mt">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn primary">Lưu</button>
                <a th:href="@{/products}" class="btn secondary">Hủy</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
