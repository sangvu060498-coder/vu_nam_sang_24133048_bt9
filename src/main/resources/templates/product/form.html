<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${productDTO.id != null} ? 'Chỉnh sửa Sản phẩm' : 'Thêm Sản phẩm mới'">Tạo/Sửa Sản phẩm</title>
</head>
<body>

<main layout:fragment="content">
    <div class="page-title">
        <h1 th:text="${productDTO.id != null} ? 'Chỉnh sửa Sản phẩm' : 'Thêm Sản phẩm mới'">Sản phẩm</h1>
        <a th:href="@{/products}" class="btn secondary">Quay lại danh sách</a>
    </div>

    <div class="panel narrow">
        <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="${productDTO.id != null} ? @{/products/edit/{id}(id=${productDTO.id})} : @{/products/create}"
              th:object="${productDTO}" method="post" enctype="multipart/form-data" class="form-grid">

            <label>Tên sản phẩm</label>
            <div>
                <input type="text" th:field="*{name}" required placeholder="Nhập tên sản phẩm">
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <label>Giá (VNĐ)</label>
            <div>
                <input type="number" th:field="*{price}" step="1000" min="0" required placeholder="0">
                <div class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>

            <label>Mô tả sản phẩm</label>
            <div>
                <textarea th:field="*{description}" placeholder="Nhập mô tả chi tiết sản phẩm..."></textarea>
            </div>

            <label>Hình ảnh sản phẩm</label>
            <div>
                <input type="file" name="imageFile" accept="image/*">
                <div th:if="${productDTO.imageUrl != null}" style="margin-top: 10px;">
                    <img th:src="${productDTO.imageUrl}" alt="Ảnh sản phẩm hiện tại" class="thumb">
                </div>
            </div>

            <div class="mt">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn primary">Lưu sản phẩm</button>
                <a th:href="@{/products}" class="btn secondary">Hủy</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
