<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Quản lý Sản phẩm - Vũ Nam Sang 24133048</title>
</head>
<body>

<main layout:fragment="content">
    <div class="page-title">
        <h1>Quản lý Products (<span th:text="${totalProducts}">0</span>)</h1>
        <a th:href="@{/products/create}" class="btn primary">+ Thêm Product</a>
    </div>

    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/products}" method="get" class="search">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Tên sản phẩm, mô tả...">
        <button type="submit" class="btn secondary">Tìm kiếm</button>
        <a th:href="@{/products}" class="btn secondary" th:if="${keyword != null and !keyword.isEmpty()}">Xóa tìm kiếm</a>
    </form>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Ảnh</th>
                <th>Name</th>
                <th>Price</th>
                <th>User</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${productPage.content}">
                <td th:text="${p.id}">1</td>
                <td>
                    <img th:if="${p.imageUrl != null}"
                         th:src="${p.imageUrl.contains('|') ? #strings.substringBefore(p.imageUrl, '|') : p.imageUrl}"
                         alt="Product Image" class="thumb">
                    <span th:unless="${p.imageUrl != null}" style="color: #94a3b8;">No image</span>
                </td>
                <td><strong th:text="${p.name}">Sản phẩm A</strong></td>
                <td>
                    <span style="color: #2563eb; font-weight: bold;" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 2, 'POINT')}">100,000.00</span>
                </td>
                <td th:text="${p.username != null ? p.username : (p.userFullName != null ? p.userFullName : 'admin')}">admin</td>
                <td class="actions">
                    <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn secondary small">Edit</a>
                    <a th:href="@{/products/delete/{id}(id=${p.id})}" class="btn danger small"
                       onclick="return confirm('Xóa product này?')">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(productPage.content)}">
                <td colspan="6" style="text-align: center; color: #64748b;">Không có dữ liệu.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="pagination" th:if="${productPage.totalPages > 1}">
        <span th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}"
              th:classappend="${i == productPage.number} ? 'active' : ''">
            <a th:href="@{/products(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
        </span>
    </div>
</main>

</body>
</html>
