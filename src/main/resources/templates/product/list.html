<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Quản lý Sản phẩm</title>
</head>
<body>

<main layout:fragment="content">
    <div class="page-title">
        <h1>Danh sách Sản phẩm (<span th:text="${totalProducts}">0</span>)</h1>
        <a th:href="@{/products/create}" class="btn primary">Thêm Sản phẩm mới</a>
    </div>

    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/products}" method="get" class="search">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Tìm kiếm sản phẩm theo tên...">
        <button type="submit" class="btn secondary">Tìm kiếm</button>
        <a th:href="@{/products}" class="btn secondary" th:if="${keyword != null and !keyword.isEmpty()}">Xóa tìm kiếm</a>
    </form>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Hình ảnh</th>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Mô tả</th>
                <th>Người đăng</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${productPage.content}">
                <td th:text="${product.id}">1</td>
                <td>
                    <img th:src="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl) ? product.imageUrl : '/images/avatar-default.png'}"
                         alt="Product" class="thumb">
                </td>
                <td><strong th:text="${product.name}">Sản phẩm A</strong></td>
                <td>
                    <span style="color: #2563eb; font-weight: bold;" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">100.000 VNĐ</span>
                </td>
                <td th:text="${product.description}">Mô tả ngắn...</td>
                <td th:text="${product.userFullName != null ? product.userFullName : 'Unknown'}">Admin</td>
                <td>
                    <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn secondary small">Sửa</a>
                    <a th:href="@{/products/delete/{id}(id=${product.id})}" class="btn danger small"
                       onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')">Xóa</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(productPage.content)}">
                <td colspan="7" style="text-align: center; color: #64748b;">Chưa có sản phẩm nào.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="pagination" th:if="${productPage.totalPages > 1}">
        <span th:each="i : ${#numbers.sequence(0, productPage.totalPages - 1)}"
              th:classappend="${i == productPage.number} ? 'active' : ''">
            <a th:href="@{/products(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
        </span>
    </div>
</main>

</body>
</html>
