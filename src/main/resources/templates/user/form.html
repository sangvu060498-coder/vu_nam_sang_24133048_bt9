<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${userDTO.id != null} ? 'Chỉnh sửa Người dùng' : 'Thêm Người dùng mới'">Tạo/Sửa Người dùng</title>
</head>
<body>

<main layout:fragment="content">
    <div class="page-title">
        <h1 th:text="${userDTO.id != null} ? 'Chỉnh sửa Thông tin Người dùng' : 'Thêm Người dùng mới'">Người dùng</h1>
        <a th:href="@{/users}" class="btn secondary">Quay lại danh sách</a>
    </div>

    <div class="panel narrow">
        <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="${userDTO.id != null} ? @{/users/edit/{id}(id=${userDTO.id})} : @{/users/create}"
              th:object="${userDTO}" method="post" enctype="multipart/form-data" class="form-grid">

            <label>Username</label>
            <div>
                <input type="text" th:field="*{username}" th:readonly="${userDTO.id != null}" required>
                <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <label>Email</label>
            <div>
                <input type="email" th:field="*{email}" th:readonly="${userDTO.id != null}" required>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <label>Họ và tên</label>
            <div>
                <input type="text" th:field="*{fullName}" required>
                <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <label>Vai trò</label>
            <div>
                <select th:field="*{roleId}" required>
                    <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.name}"></option>
                </select>
            </div>

            <label>Trạng thái</label>
            <div>
                <label style="display: inline-flex; align-items: center; gap: 8px; font-weight: normal;">
                    <input type="checkbox" th:field="*{enabled}"> Kích hoạt tài khoản
                </label>
            </div>

            <label>Ảnh đại diện</label>
            <div>
                <input type="file" name="imageFile" accept="image/*">
                <div th:if="${userDTO.images != null}" style="margin-top: 10px;">
                    <img th:src="${userDTO.images}" alt="Avatar hiện tại" class="thumb">
                </div>
            </div>

            <div class="mt">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn primary">Lưu thông tin</button>
                <a th:href="@{/users}" class="btn secondary">Hủy</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
