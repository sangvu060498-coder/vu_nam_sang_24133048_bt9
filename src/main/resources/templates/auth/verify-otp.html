<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xác nhận OTP - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Xác thực mã OTP</h2>

    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
        <label>Email xác thực</label>
        <input type="email" th:field="*{email}" readonly style="background-color: #f1f5f9;">

        <label>Mã OTP (6 chữ số)</label>
        <input type="text" th:field="*{otpCode}" maxlength="6" required placeholder="123456" autofocus style="text-align: center; font-size: 20px; letter-spacing: 4px;">
        <div class="field-error" th:if="${#fields.hasErrors('otpCode')}" th:errors="*{otpCode}"></div>

        <input type="hidden" th:field="*{type}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <button class="btn primary full mt" type="submit">Xác thực OTP & Kích hoạt</button>
    </form>

    <p style="text-align: center; margin-top: 20px;">
        <a th:href="@{/login}">Quay lại Đăng nhập</a>
    </p>
</div>
</body>
</html>
