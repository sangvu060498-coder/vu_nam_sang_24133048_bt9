<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Quên mật khẩu</h2>

    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
        <label>Nhập Email đã đăng ký</label>
        <input type="email" th:field="*{email}" required placeholder="example@gmail.com" autofocus>
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <button class="btn primary full mt" type="submit">Gửi mã OTP đặt lại mật khẩu</button>
    </form>

    <p style="text-align: center; margin-top: 20px;">
        <a th:href="@{/login}">Quay lại Đăng nhập</a>
    </p>
</div>
</body>
</html>
