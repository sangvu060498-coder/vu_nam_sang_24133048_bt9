<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký - IOTSTAR SHOP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>IOTSTAR SHOP</h1>
    <h2>Đăng ký tài khoản</h2>

    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/register}" th:object="${registerDTO}" method="post">
        <label>Username</label>
        <input type="text" th:field="*{username}" required placeholder="Nhập tên đăng nhập">
        <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>

        <label>Email</label>
        <input type="email" th:field="*{email}" required placeholder="example@gmail.com">
        <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <label>Họ và tên</label>
        <input type="text" th:field="*{fullName}" required placeholder="Nhập họ và tên đầy đủ">
        <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>

        <label>Mật khẩu</label>
        <input type="password" th:field="*{password}" required placeholder="Nhập mật khẩu (ít nhất 6 ký tự)">
        <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

        <label>Xác nhận mật khẩu</label>
        <input type="password" th:field="*{confirmPassword}" required placeholder="Nhập lại mật khẩu">
        <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <button class="btn primary full mt" type="submit">Đăng ký & Gửi OTP</button>
    </form>

    <p style="text-align: center; margin-top: 20px;">
        Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a>
    </p>
</div>
</body>
</html>
